<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#fff;background:#000}
.overlay{height:100vh;height:100dvh;background:url("6-bg.jpg") center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}
.container{width:100%;max-width:450px;background:rgba(25,15,60,.78);border-radius:20px;padding:clamp(14px,3vh,26px) 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.badge{background:#d92b2b;color:#fff;padding:4px 14px;border-radius:20px;font-size:clamp(.8rem,2.4vh,.95rem);font-weight:700;margin-bottom:clamp(8px,2vh,16px);display:inline-block;animation:pulse 2s infinite}

h1{font-size:clamp(1.9rem,7vh,2.7rem);margin:0 0 clamp(8px,2vh,14px);line-height:1.1;text-shadow:0 3px 10px rgba(0,0,0,.5)}

.subtitle{font-size:clamp(1rem,2.8vh,1.2rem);margin:0 0 clamp(14px,3.5vh,26px);line-height:1.5;opacity:.95}
.cta-btn{display:block;width:100%;background:#0b7d3b;color:#fff;font-size:clamp(1.2rem,3.6vh,1.5rem);padding:clamp(12px,2.6vh,18px) 20px;border-radius:12px;font-weight:800;text-decoration:none;animation:ripple 2.4s infinite}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(11,125,59,.55);transform:scale(1)}60%{box-shadow:0 0 0 14px rgba(11,125,59,0);transform:scale(1.02)}100%{box-shadow:0 0 0 0 rgba(11,125,59,0);transform:scale(1)}}
.cta-btn:hover{background:#096b32}
.small-note{font-size:clamp(.8rem,2.2vh,.95rem);margin:clamp(10px,2.5vh,18px) 0 0;color:#ddd;line-height:1.6}
</style>
</head>
<body>
<main class="overlay">
<div class="container">

<p class="small-note">✓ ללא עלות • ✓ ניתן לעזוב בכל עת • ✓ רק מוצרים שווים</p>
</div>
</main>
</body>
</html>
